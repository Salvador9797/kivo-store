name: Comprobaciones
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node tests/search-intent.cjs && node tests/izzy-loading.cjs && node tests/approved-design.cjs && node tests/download-progress.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Comprobar versiones y programación del catálogo
        run: |
          mkdir -p /tmp/kivo-tests
          javac -d /tmp/kivo-tests app/src/main/java/app/kivo/store/Versions.java app/src/main/java/app/kivo/store/UpdatePolicy.java app/src/main/java/app/kivo/store/CatalogSchedule.java tests/SelectedVersionTest.java tests/CatalogScheduleTest.java
          java -cp /tmp/kivo-tests app.kivo.store.SelectedVersionTest
          java -cp /tmp/kivo-tests app.kivo.store.CatalogScheduleTest
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verificar wrapper y distribución de Gradle
        run: |
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          grep -Fx 'distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v5
      - run: bash gradlew :app:assembleDebug :app:assembleRelease --no-daemon
