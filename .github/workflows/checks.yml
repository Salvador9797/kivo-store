name: Comprobaciones
on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node tests/search-intent.cjs && node tests/izzy-loading.cjs && node tests/approved-design.cjs && node tests/download-progress.cjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Comprobar versiones y programación del catálogo
        run: |
          mkdir -p /tmp/kivo-tests
          javac -d /tmp/kivo-tests app/src/main/java/app/kivo/store/Versions.java app/src/main/java/app/kivo/store/UpdatePolicy.java app/src/main/java/app/kivo/store/CatalogSchedule.java tests/SelectedVersionTest.java tests/CatalogScheduleTest.java
          java -cp /tmp/kivo-tests app.kivo.store.SelectedVersionTest
          java -cp /tmp/kivo-tests app.kivo.store.CatalogScheduleTest
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - name: Verificar wrapper y distribución de Gradle
        run: |
          echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          grep -Fx 'distributionSha256Sum=21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607' gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v5
      - run: bash gradlew :app:assembleDebug :app:assembleRelease --no-daemon
